name: Fork CI

# Fork-only (dddd-zdf/cairn): builds and tests feature branches on push,
# since ci.yml only runs for main and pull requests. Also compiles the iOS
# app target, which `swift build` doesn't cover. Drop this file before
# proposing anything upstream.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: swift build + swift test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - run: swift build
      - name: swift test (reverse-deletes suites only, no crash tolerance)
        if: ${{ hashFiles('Sources/CairnCore/ReverseDelete/ServerTrashMatcher.swift') != '' }}
        run: swift test --filter "ServerTrashMatcher|LocalDeleteOrchestrator|ImmichClientTrashed|ServerTrashCheckPolicy"
      - name: swift test
        # Same signal-5 teardown tolerance as ci.yml.
        run: |
          set +e -o pipefail
          swift test 2>&1 | tee /tmp/swifttest.log
          ec=${PIPESTATUS[0]}
          if [ "$ec" -eq 0 ]; then exit 0; fi
          if grep -qE "recorded an issue|✘ Test" /tmp/swifttest.log; then
            echo "::error::swift test had real test failures"
            exit 1
          fi
          if grep -qi "exited with unexpected signal code 5" /tmp/swifttest.log; then
            echo "::warning::tolerating known signal-5 teardown crash"
            exit 0
          fi
          exit 1

  unsigned-ipa:
    name: Unsigned device IPA (for SideStore)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Generate project
        working-directory: iOS
        run: xcodegen generate
      - name: Build for device, unsigned
        run: |
          set -o pipefail
          xcodebuild -project iOS/Cairn.xcodeproj -scheme Cairn -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/ipa.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" /tmp/ipa.log
      - name: Package IPA
        run: |
          app=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload && cp -R "$app" Payload/
          zip -qry cairn-reverse-deletes-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: cairn-reverse-deletes-unsigned-ipa
          path: cairn-reverse-deletes-unsigned.ipa
          retention-days: 14

  ios-build:
    name: iOS app build (simulator, unsigned)
    # Newest image: the app target needs a recent Swift 6 toolchain.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      - run: brew install xcodegen
      - name: Generate project
        working-directory: iOS
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project iOS/Cairn.xcodeproj -scheme Cairn \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log | grep -E "error:|warning: .*(ServerTrash|LocalDelete|PhotoKitLocalAssetDeleter)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" /tmp/xcodebuild.log
